<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Surgeon&#39;s Wound Atlas</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#EFece4; --panel:#fff; --ink:#211c19; --muted:#6c625b; --line:#e2dcd2;
  --bar:#2a2320; --accent:#7B2D26;
}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;background:var(--bg);color:var(--ink);min-height:100vh}
.app{display:grid;grid-template-columns:360px 1fr;grid-template-rows:auto 1fr;min-height:100vh}
.topbar{grid-column:1/-1;background:var(--bar);color:#f4efe7;padding:12px 22px;display:flex;align-items:baseline;gap:16px;border-bottom:3px solid var(--accent)}
.topbar h1{font-family:Georgia,"Times New Roman",serif;font-size:21px;font-weight:600;letter-spacing:.3px}
.topbar .sub{font-size:12.5px;opacity:.65;margin-left:auto;font-style:italic}
.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:16px;overflow-y:auto;height:calc(100vh - 52px)}
.main{padding:20px 24px;overflow-y:auto;height:calc(100vh - 52px)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.panel-title{font-family:Georgia,serif;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:1px;padding-bottom:8px;border-bottom:1px solid var(--line)}

/* body diagram */
.figure-wrap{display:flex;justify-content:center;padding:4px 0 10px}
svg .zone path, svg .zone ellipse{fill:#d9cfc2;stroke:#b7a998;stroke-width:1.5;cursor:pointer;transition:fill .14s,stroke .14s}
svg .zone:hover path, svg .zone:hover ellipse{fill:#c4b39e}
svg .zone.active path, svg .zone.active ellipse{fill:var(--accent);stroke:#54211c}
.zone-label{font-size:11px;fill:#5c534b;pointer-events:none;font-family:system-ui,sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.fig-hint{text-align:center;font-size:12px;color:var(--muted);font-style:italic;margin-top:2px}

/* damage selector */
.dt-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.dt-btn{padding:9px 8px;border:1px solid var(--line);border-radius:7px;background:#faf8f4;cursor:pointer;font-size:13px;font-weight:600;color:#3a332e;text-align:left;display:flex;align-items:center;gap:8px;transition:all .12s}
.dt-btn .dot{width:11px;height:11px;border-radius:50%;flex:none}
.dt-btn:hover:not(.disabled){background:#fff;border-color:#bbab97;transform:translateY(-1px)}
.dt-btn.active{color:#fff}
.dt-btn.disabled{opacity:.4;cursor:not-allowed;font-weight:500}
.dt-btn.disabled .tag{margin-left:auto;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;opacity:.8}
.loc-meta{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.5}
.loc-meta b{color:var(--ink)}

/* main content */
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:70%;color:var(--muted);text-align:center;gap:14px}
.placeholder .big{font-family:Georgia,serif;font-size:22px;color:#9a8d80}
.result-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.result-head .pill{color:#fff;font-weight:700;font-size:13px;padding:5px 14px;border-radius:20px;font-family:Georgia,serif;letter-spacing:.3px}
.result-head h2{font-family:Georgia,serif;font-size:24px;font-weight:600}
.affinity{font-size:13px;color:var(--muted);font-style:italic;margin-bottom:6px;line-height:1.5;max-width:900px}
.acline{font-size:13px;color:var(--ink);margin-bottom:16px}
.acline .chip{display:inline-block;background:#efe7da;border:1px solid #ddd0bd;border-radius:6px;padding:2px 9px;font-weight:700;margin-left:4px}

table.wt{border-collapse:collapse;width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
table.wt th{color:#fff;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;padding:10px 12px;font-weight:700}
table.wt td{padding:11px 12px;font-size:13px;vertical-align:top;border-top:1px solid var(--line);line-height:1.45}
table.wt td.roll{text-align:center;font-weight:700;font-family:Georgia,serif;font-size:15px;white-space:nowrap;width:54px}
table.wt td.wound{font-family:Georgia,serif;font-weight:600;width:175px}
td.hp{width:130px}td.attr{width:150px}td.dc{width:90px;text-align:center;font-weight:600}
td.dash{color:#bbada0}
tr.mortal td{background:#1a1614!important;color:#f0e9e0;border-top-color:#000}
tr.mortal td.wound{color:#f3b0a8}
tr.mortal td.dc{color:#a99}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--muted)}
.legend b{color:var(--ink)}
.foot{margin-top:18px;font-size:11.5px;color:#9a8d80;font-style:italic}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <h1>Field Surgeon&#39;s Wound Atlas</h1>
    <span class="sub">click a location &middot; choose a damage type &middot; read the consequence</span>
  </div>

  <div class="sidebar">
    <div class="panel">
      <div class="panel-title">Body Location</div>
      <div class="figure-wrap" id="figwrap"></div>
      <div class="fig-hint" id="fighint">Select a body location</div>
    </div>
    <div class="panel" id="dtpanel" style="display:none">
      <div class="panel-title">Damage Type</div>
      <div class="dt-grid" id="dtgrid"></div>
      <div class="loc-meta" id="locmeta"></div>
    </div>
  </div>

  <div class="main" id="main">
    <div class="placeholder">
      <div class="big">An anatomy of harm.</div>
      <div>Choose a body location from the figure, then a damage type,<br>to see every wound that can result from a strike there.</div>
    </div>
  </div>
</div>

let curLoc = null, curDT = null;

/* ---- body figure SVG ---- */

const figwrap = document.getElementById('figwrap');
figwrap.innerHTML = FIG;
figwrap.querySelectorAll('.zone').forEach(z=>{
  z.addEventListener('click', ()=> selectLoc(z.dataset.loc));
});

function selectLoc(loc){
  curLoc = loc; curDT = null;
  figwrap.querySelectorAll('.zone').forEach(z=>{
    z.classList.toggle('active', z.dataset.loc===loc);
  });
  document.getElementById('fighint').textContent = loc + ' selected';
  buildDTPanel();
  renderMain();
}

function buildDTPanel(){
  document.getElementById('dtpanel').style.display='block';
  const grid = document.getElementById('dtgrid');
  grid.innerHTML='';
  DB.all_dtypes.forEach(dt=>{
    const b=document.createElement('button');
    b.className='dt-btn'+(dt.ready?'':' disabled')+(curDT===dt.name?' active':'');
    if(curDT===dt.name) b.style.background=dt.color;
    b.innerHTML = `<span class="dot" style="background:${dt.color}"></span>${dt.name}`+
      (dt.ready?'':'<span class="tag">soon</span>');
    if(dt.ready) b.addEventListener('click', ()=>{ curDT=dt.name; buildDTPanel(); renderMain(); });
    grid.appendChild(b);
  });
  const ac = DB.ac[curLoc];
  document.getElementById('locmeta').innerHTML =
    `<b>${curLoc}</b> &mdash; base AC <b>${ac}</b> (before DEX / WIS / proficiency &amp; armor tier).`;
}

function severityStyle(idx, total, baseHex){
  // pale -> saturated gradient down the table
  const t = total<=1?0:idx/(total-1);
  const alpha = 0.06 + t*0.30;
  return `background:${hexA(baseHex,alpha)};`;
}
function hexA(hex,a){
  const n=parseInt(hex.slice(1),16);
  const r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return `rgba(${r},${g},${b},${a.toFixed(3)})`;
}

function renderMain(){
  const main=document.getElementById('main');
  if(!curLoc){ return; }
  if(!curDT){
    main.innerHTML = `<div class="placeholder">
      <div class="big">${curLoc}</div>
      <div>Now choose a damage type on the left to see the wound table.</div></div>`;
    return;
  }
  const hex = DB.hex[curDT];
  const entry = DB.wounds[curDT][curLoc];
  const rows = entry.rows;
  let html = `
    <div class="result-head">
      <span class="pill" style="background:${hex}">${curDT}</span>
      <h2>${curLoc}</h2>
    </div>
    <div class="affinity">${DB.affinity[curDT]}</div>
    <div class="acline">${entry.desc}</div>
    <div class="acline">Base AC for this location:
      <span class="chip">${DB.ac[curLoc]}</span>
      &nbsp;Roll <b>d20 + wound modifiers</b>, cap at 20.</div>
    <table class="wt">
      <thead><tr style="background:${hex}">
        <th style="text-align:center">d20</th><th>Wound</th><th>HP Damage</th>
        <th>Attribute Damage</th><th>Other Effects</th><th style="text-align:center">Med. DC</th>
      </tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    const mortal = (r[4]||'').includes('Dead. No saves') || (r[3]||'').includes('set to 0');
    const style = mortal ? '' : severityStyle(i, rows.length, hex);
    const dash = v => (v==='\u2014'||v==='')?'<span class="dash">\u2014</span>':v;
    html += `<tr class="${mortal?'mortal':''}" ${mortal?'':`style="${style}"`}>
      <td class="roll">${r[0]}</td>
      <td class="wound">${r[1]}</td>
      <td class="hp">${dash(r[2])}</td>
      <td class="attr">${dash(r[3])}</td>
      <td>${dash(r[4])}</td>
      <td class="dc">${dash(r[5])}</td></tr>`;
  });
  html += `</tbody></table>
    <div class="legend">
      <span><b>HP Damage</b> = bleed/ongoing, scales with durability</span>
      <span><b>Attribute Damage</b> = does NOT scale; CON to 0 = death</span>
      <span><b>Med. DC</b> = Medicine check to stabilize</span>
    </div>
    <div class="foot"><b>This page is the wound <i>content</i>, not the live rules.</b> Its ladders read at d20 resolution and the live tool is <code>Codex.html</code>. Current rule: every landed hit wounds, and the wound is a comparison rather than a roll &mdash; the force of the blow divided by the region&rsquo;s Wound Step (its toughness &divide; 5), read 1&ndash;20. Serious+ is wound 9 or worse. A crit doubles the force before armour and can never read less than one wound worse than the same blow uncritted; a Punishing Strike multiplies it by 1.5; a gap thrust multiplies nothing and reads a flat 4 + the armour&rsquo;s Gap Rating + the weapon&rsquo;s Gap Bite. Retired and kept here only to explain old text: the d100 wound roll, the +25/+20 flat bonuses, the &ldquo;drops the target to 0 RHP&rdquo; trigger, and Real HP thresholds.</div>`;
  main.innerHTML = html;
}
